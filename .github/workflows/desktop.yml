name: Build desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Phạm vi hiện tại: chỉ Windows. Linux và macOS để làm sau — mã nguồn đã
        # chạy được cả ba, chỉ là chưa dựng và chưa kiểm thử ở đây.
        #
        # Bật Linux: bỏ dấu chú thích hai dòng dưới. Bước cài phụ thuộc
        # WebKitGTK bên dưới đã có sẵn và tự kích hoạt theo label.
        #   - os: ubuntu-22.04
        #     label: linux
        #
        # Bật macOS: thêm { os: macos-14, label: macos }, rồi bổ sung bước import
        # chứng chỉ Apple và notarize trước khi đóng gói.
        include:
          - os: windows-latest
            label: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # WebKitGTK + các thư viện Tauri cần trên Linux.
      - name: Phụ thuộc hệ thống (Linux)
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev build-essential curl wget file

      - name: Cài phụ thuộc
        run: |
          npm ci
          npm ci --prefix web

      - name: Sinh icon
        run: node scripts/gen-icons.mjs

      - name: Build
        run: npm run desktop:build

      - uses: actions/upload-artifact@v4
        with:
          name: mittohoa-timeis-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
