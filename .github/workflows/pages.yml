name: Deploy web lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ cho một lần deploy chạy tại một thời điểm; lần mới huỷ lần đang chạy dở.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cài phụ thuộc
        run: npm ci --prefix web

      - name: Sinh icon
        run: node scripts/gen-icons.mjs

      - name: Build
        # Pages phục vụ site tại /<tên-repo>/ nên phải đặt base cho đúng.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build:web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
