<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover + safe-area trong CSS: bắt buộc cho edge-to-edge của Android 15+ -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Đồng hồ chính xác đồng bộ theo giờ nguyên tử, xem giờ mọi múi giờ, chạy được cả khi ngoại tuyến."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <title>Giờ Chuẩn</title>
  </head>
  <body>
    <!-- Splash tĩnh, nằm trong HTML nên hiện ngay trước cả khi JS chạy. -->
    <div class="splash" id="splash" aria-hidden="true">
      <div class="splash__mark"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
